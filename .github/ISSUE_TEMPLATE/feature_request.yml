name: Feature request
description: Propose a focused automation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Permission, artifact, and rollback impact
    validations:
      required: true
