services:
  api:
    build:
      context: .
      target: production
    image: pipeline-demo-api:local
    user: "10001:10001"
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENVIRONMENT: development
      APP_VERSION: local
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 15s
